# Gerado por fernando-moretes/platform (TechDocs do Backstage). O conteudo e do
# repositorio: escreva em docs/*.md; este arquivo so lista as paginas.
site_name: ref-architect-frameworks-hub
site_description: "Reference hub for AWS Well-Architected, TOGAF, C4, ArchiMate, DDD, 12-Factor and Cynefin."
repo_url: https://github.com/fernandofatech/ref-architect-frameworks-hub
edit_uri: edit/main/docs/
docs_dir: docs
plugins:
  - techdocs-core
nav:
  - Visão geral: index.md
  - Arquitetura: arquitetura.md
  - Operação: operacao.md
  - API: api.md
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
